<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公式LINE登録のご案内</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            background-color: white;
            min-height: 100vh;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid #e9ecef;
        }

        .article-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #212529;
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .author-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #6c757d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .author-name {
            font-weight: 500;
            color: #495057;
        }

        .content {
            padding: 20px;
        }

        .free-content {
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 32px;
        }

        .free-content p {
            margin-bottom: 16px;
        }

        .paywall {
            background-color: white;
            padding: 30px 0;
            text-align: center;
        }

        .paywall-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 16px;
            color: #212529;
        }

        .price-info {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .price-note {
            font-size: 16px;
            color: #6c757d;
        }

        .line-button {
            display: inline-block;
            background-color: #00b900;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 14px 24px;
            border-radius: 6px;
            text-decoration: none;
            max-width: 320px;
            width: 100%;
            box-sizing: border-box;
            margin: 0 auto 16px;
        }

        .login-link {
            font-size: 14px;
            color: #6c757d;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1 class="article-title">公式LINE登録のご案内</h1>
            <div class="author-info">
                <div class="author-avatar">美</div>
                <span class="author-name">美澪</span>
            </div>
        </div>

        <div class="content">
            <div class="free-content">
                <p>公式LINEでは、あなたのお悩みに合わせたご案内をお届けしています。</p>

                <p>ご希望の方は、こちらから登録してください。</p>

                <p><strong>あなたのお心が少しでも軽くなるきっかけになれますように。</strong></p>

                <p>↓↓↓↓</p>
            </div>

            <div class="paywall">
                <h2 class="paywall-title">公式LINEはこちら</h2>

                <div class="price-info">
                    <div class="price-note">LINE限定でご案内中</div>
                </div>

                <a href="https://lin.ee/8ugiLpG" class="line-button">公式LINEに登録する</a>

                <p class="login-link">友だち追加後、LINEにてご案内をお送りします</p>
            </div>
        </div>
    </div>
</body>
</html>
