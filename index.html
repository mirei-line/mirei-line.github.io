<!DOCTYPE html>
<html lang="ja"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無料鑑定のご案内</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        li {
            list-style: none;
            font-size: 20px;;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }
        .strong{
            font-weight: bold;
        }
        .container {
            max-width: 680px;
            margin: 0 auto;
            background-color: white;
            min-height: 100vh;
        }
        
        .header {
            padding: 20px;
            border-bottom: 1px solid #e9ecef;
        }
        
        .article-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #212529;
        }
        
        .author-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .author-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #6c757d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        .author-name {
            font-weight: 500;
            color: #495057;
        }
        
        .content {
            padding: 20px;
        }
        
        .free-content {
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 40px;
        }
        
        .paywall {
            position: relative;
            background-color: white;
            padding: 40px 0;
            text-align: center;
        }
        
        .paywall-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            background-color: #41c9b4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }
        
        .paywall-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #212529;
        }
        
        .paywall-description {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        
        .price-info {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }
        
        .price {
            font-size: 24px;
            font-weight: bold;
            color: #212529;
            margin-bottom: 4px;
        }
        
        .price-note {
            font-size: 16px;
            color: #6c757d;
        }
        
        .purchase-button {
            width: 100%;
            background-color: #00b900;
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 16px;
        }
        
        .support-button {
            width: 100%;
            background-color: transparent;
            color: #41c9b4;
            border: 2px solid #41c9b4;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 20px;
        }
        
        .support-button:hover {
            color: white;
        }
        
        .login-link {
            font-size: 16px;
            color: #6c757d;
            text-decoration: none;
        }
        
        .blurred-content {
            height: 150px;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .blurred-text {
            filter: blur(2px);
            user-select: none;
            color: #999;
            font-size: 16px;
            line-height: 1.8;
            padding: 0;
            position: relative;
            z-index: 1;
        }
        
        .fade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, 
                rgba(255,255,255,0) 0%, 
                rgba(255,255,255,0.3) 30%, 
                rgba(255,255,255,0.7) 60%,
                rgba(255,255,255,0.95) 85%,
                rgba(255,255,255,1) 100%);
            z-index: 2;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="article-title">LINE誘導ページ</h1>
            <div class="author-info">
                <div class="author-avatar">美</div>
                <span class="author-name">美澪</span>
            </div>
        </div>
        
        <div class="content">
<div class="free-content">
  <p><strong>無料鑑定のご案内</strong>をお送りします。</p>

  <p>この先の詳細は、<strong>友だち追加後にLINEでお届け</strong>します。</p>

  <p><strong>無料鑑定を受け取りたい方は、下のボタンから追加してください。</strong></p>

  <p>↓↓↓↓</p>
</div>
            
            <div class="blurred-content">
                <div class="blurred-text">
                    【鑑定でお聞きする項目】
                    ・お名前（ニックネー厶OK）
                    ・生年月日（西暦）
                    ・性別
                    ・未婚/既婚
                    ・お悩みや知りたいこと
など
               

                    続きはLINEの友だち追加後にご確認ください。
                </div>
                <div class="fade-overlay"></div>
            </div>
            
            <div class="paywall">
                <h2 class="paywall-title">ここから先は</h2>
                <div class="price-info">
                    <div class="price-note">500文字 / 1画像</div>
                </div>
                    <div style="text-align:center; margin-bottom:20px;"><a href="https://lin.ee/8ugiLpG" style="display:inline-block; background-color:#00b900; color:white; font-size:16px; font-weight:bold; padding:14px 24px; border-radius:6px; text-decoration:none; transition:background-color 0.3s ease; max-width:320px; width:100%; box-sizing:border-box; margin: 0 auto;">友だち追加で読む</a></div><p class="login-link">友だち追加すると本編付きの記事URLが送られてきます</p>
        </div>
        </div>
    </div>
</body>
</html>
